<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="記帳加班">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-180.png">
<title>記帳・加班 1.1</title>
<style>
:root{--bg:#050607;--card:#17191c;--card2:#202225;--text:#f5f5f7;--muted:#8e9299;--line:#2a2d31;--blue:#3b82f6;--green:#34c759;--red:#ff5b5b;--orange:#ff8a32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
button,input,select{font:inherit}.app{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
h1{font-size:30px;margin:8px 0 18px}.top{display:flex;align-items:center;justify-content:space-between}.monthNav{display:flex;align-items:center;gap:14px}.iconBtn{border:0;background:#15171a;color:#fff;width:42px;height:42px;border-radius:14px;font-size:23px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);padding:13px;border-radius:16px}.stat small{color:var(--muted)}.stat b{display:block;font-size:21px;margin-top:5px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#aaa;padding:8px 0;font-size:13px}.day{min-height:78px;border:0;border-radius:14px;background:transparent;color:#fff;padding:7px;text-align:left;position:relative}.day.other{opacity:.22}.day.today{background:#1b1d20}.day.selected{outline:2px solid var(--blue);background:#151c27}.num{font-size:20px}.hours{display:block;color:var(--blue);font-size:14px;margin-top:8px}.leave{color:var(--orange)}.dot{width:5px;height:5px;background:#aaa;border-radius:50%;position:absolute;top:5px;left:50%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:15px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.muted{color:var(--muted)}.btn{border:0;border-radius:13px;background:#292c30;color:#fff;padding:11px 14px}.primary{background:var(--blue)}.danger{background:#4a2427;color:#ff9da4}
.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 2px}.item:last-child{border:0}
.fab{position:fixed;right:22px;bottom:calc(90px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:34px;box-shadow:0 8px 30px #0008}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#111316eF;backdrop-filter:blur(16px);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.tab{border:0;background:transparent;color:#777;padding:8px 35px}.tab.active{color:var(--blue)}.section{display:none}.section.active{display:block}
.sheetWrap{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end}.sheetWrap.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#202020;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.sheet h2{margin:0}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.seg button,.hoursGrid button{border:0;background:#333;color:#ddd;border-radius:10px;padding:12px}.seg button.active,.hoursGrid button.active{background:var(--blue);color:#fff}
.hoursGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;background:#111;border:1px solid var(--line);border-radius:12px;padding:12px;color:#fff}
.bigInput{font-size:30px}.expenseHead{background:linear-gradient(135deg,#17253a,#1b1d21);border-radius:22px;padding:18px;margin-bottom:15px}.expenseHead .amount{font-size:38px;font-weight:800}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kind button{border:0;border-radius:12px;padding:13px;background:#2a2d31;color:#fff}.kind button.active{background:var(--blue)}
@media(max-width:430px){.day{min-height:68px;padding:5px}.num{font-size:18px}.hoursGrid{grid-template-columns:repeat(4,1fr)}.tab{padding:8px 28px}}
</style></head><body><div class="app">

<section id="money" class="section active">
<div class="top"><h1>記帳 <span style="font-size:12px;color:#777;font-weight:500">v1.1</span></h1><button class="iconBtn" onclick="openMoney()">＋</button></div>
<div class="expenseHead"><div class="muted">本月結餘</div><div class="amount" id="balance">$0</div><div class="summary"><div><small class="muted">支出</small><b id="expense">$0</b></div><div><small class="muted">收入</small><b id="income">$0</b></div><div><small class="muted">筆數</small><b id="txCount">0</b></div></div></div>
<div class="card"><div class="row between"><b>本月紀錄</b><span class="muted" id="moneyMonth"></span></div><div class="list" id="txList"></div></div>
<button class="fab" onclick="openMoney()">＋</button>
</section>

<section id="ot" class="section">
<div class="top"><h1>加班 <span style="font-size:12px;color:#777;font-weight:500">v1.1</span></h1><div class="monthNav"><button class="iconBtn" onclick="moveMonth(-1)">‹</button><b id="monthTitle"></b><button class="iconBtn" onclick="moveMonth(1)">›</button></div></div>
<div class="calendar" id="calendar"></div>
<div class="summary"><div class="stat"><small>加班總時數</small><b id="totalHours">0.00 h</b></div><div class="stat"><small>加班天數</small><b id="otDays">0 天</b></div><div class="stat"><small>平均</small><b id="avgHours">0 h</b></div></div>
<div class="card"><div class="row between"><b>加班記錄</b><span class="muted">點日期即可修改</span></div><div class="list" id="otList"></div></div>
</section>
</div>

<div class="sheetWrap" id="otSheet" onclick="if(event.target===this)closeSheet('otSheet')"><div class="sheet">
<div class="row between"><h2 id="sheetDate">日期</h2><button class="iconBtn" onclick="closeSheet('otSheet')">×</button></div>
<div class="seg"><button id="typeOT" class="active" onclick="setOTType('ot')">加班</button><button id="typeLeave" onclick="setOTType('leave')">請假</button><button id="typeRest" onclick="setOTType('rest')">休息</button></div>
<div id="hoursArea"><div class="muted" style="margin-bottom:9px">加班時數</div><div class="hoursGrid" id="hoursGrid"></div>
<div class="field"><label>也可以直接輸入小時</label><input id="customHours" type="number" min="0" max="24" step=".5" placeholder="例如 3.5"></div></div>
<div class="field"><label>備註</label><input id="otNote" placeholder="例如：設備維修"></div>
<div class="row"><button class="btn danger" onclick="deleteOT()">刪除</button><button class="btn primary" style="flex:1" onclick="saveOT()">儲存</button></div>
</div></div>

<div class="sheetWrap" id="moneySheet" onclick="if(event.target===this)closeSheet('moneySheet')"><div class="sheet">
<div class="row between"><h2>新增記帳</h2><button class="iconBtn" onclick="closeSheet('moneySheet')">×</button></div>
<div class="kind"><button id="kExpense" class="active" onclick="setKind('expense')">支出</button><button id="kIncome" onclick="setKind('income')">收入</button></div>
<div class="field"><label>金額</label><input id="mAmount" class="bigInput" inputmode="decimal" type="number" placeholder="0"></div>
<div class="field"><label>分類</label><select id="mCat"><option>餐飲</option><option>交通</option><option>購物</option><option>娛樂</option><option>生活</option><option>醫療</option><option>薪資</option><option>其他</option></select></div>
<div class="field"><label>日期</label><input id="mDate" type="date"></div>
<div class="field"><label>備註</label><input id="mNote" placeholder="選填"></div>
<button class="btn primary" style="width:100%" onclick="saveMoney()">儲存</button>
</div></div>

<nav class="tabs"><button class="tab active" data-id="money" onclick="tab('money')">▣<br>記帳</button><button class="tab" data-id="ot" onclick="tab('ot')">◷<br>加班</button></nav>

<script>
const $=x=>document.getElementById(x);
let S=JSON.parse(localStorage.getItem('shihong-ledger-ot')||'null')||{tx:[],ot:{}};
let view=new Date(),selectedDate='',selectedHours=0,otType='ot',moneyKind='expense';
function save(){localStorage.setItem('shihong-ledger-ot',JSON.stringify(S))}
function keyDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tab(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));if(id==='ot')renderCal();else renderMoney()}
function closeSheet(id){$(id).classList.remove('show')}
function renderCal(){
 let y=view.getFullYear(),m=view.getMonth();$('monthTitle').textContent=`${y}年${m+1}月`;
 let first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 let html=['一','二','三','四','五','六','日'].map(x=>`<div class="dow">週${x}</div>`).join('');
 for(let i=0;i<start;i++)html+=`<div></div>`;
 let total=0,count=0,records=[];
 for(let d=1;d<=days;d++){let dt=new Date(y,m,d),k=keyDate(dt),r=S.ot[k],today=k===keyDate(new Date());if(r&&r.type==='ot'){total+=+r.hours||0;if(+r.hours>0)count++;records.push([k,r])}
 let sub=r?(r.type==='ot'?`${r.hours||0}h`:r.type==='leave'?'請假':'休'):'';
 html+=`<button class="day ${today?'today':''}" onclick="openOT('${k}')"><span class="dot"></span><span class="num">${d}</span>${sub?`<span class="hours ${r.type!=='ot'?'leave':''}">${sub}</span>`:''}</button>`}
 $('calendar').innerHTML=html;$('totalHours').textContent=total.toFixed(2)+' h';$('otDays').textContent=count+' 天';$('avgHours').textContent=(count?total/count:0).toFixed(1)+' h';
 $('otList').innerHTML=records.length?records.reverse().map(([k,r])=>`<div class="item" onclick="openOT('${k}')"><div><b>${k.slice(5).replace('-','/')}</b><div class="muted">${r.note||'加班'}</div></div><b style="color:var(--blue)">${r.hours} h ›</b></div>`).join(''):'<div class="muted" style="padding:16px 0">本月還沒有加班紀錄。</div>';
}
function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderCal()}
function openOT(k){selectedDate=k;let r=S.ot[k]||{type:'ot',hours:0,note:''};otType=r.type;selectedHours=+r.hours||0;$('sheetDate').textContent=k.replaceAll('-',' / ');$('otNote').value=r.note||'';$('customHours').value=selectedHours||'';setOTType(otType);renderHours();$('otSheet').classList.add('show')}
function setOTType(t){otType=t;$('typeOT').classList.toggle('active',t==='ot');$('typeLeave').classList.toggle('active',t==='leave');$('typeRest').classList.toggle('active',t==='rest');$('hoursArea').style.display=t==='ot'?'block':'none'}
function renderHours(){let vals=[0,.5,1,1.5,2,2.5,3,3.5,4,4.5,5,5.5,6,7,8,9,10,11,12];$('hoursGrid').innerHTML=vals.map(v=>`<button class="${selectedHours===v?'active':''}" onclick="selectedHours=${v};$('customHours').value='${v}';renderHours()">${v}</button>`).join('')}
function saveOT(){let h=+$('customHours').value||0;S.ot[selectedDate]={type:otType,hours:otType==='ot'?h:0,note:$('otNote').value.trim()};save();closeSheet('otSheet');renderCal()}
function deleteOT(){delete S.ot[selectedDate];save();closeSheet('otSheet');renderCal()}
function openMoney(){$('mDate').value=keyDate(new Date());$('mAmount').value='';$('mNote').value='';$('moneySheet').classList.add('show')}
function setKind(k){moneyKind=k;$('kExpense').classList.toggle('active',k==='expense');$('kIncome').classList.toggle('active',k==='income')}
function saveMoney(){let amount=+$('mAmount').value;if(!amount)return alert('請輸入金額');S.tx.push({id:Date.now(),kind:moneyKind,amount,cat:$('mCat').value,date:$('mDate').value,note:$('mNote').value.trim()});save();closeSheet('moneySheet');renderMoney()}
function delTx(id){if(confirm('刪除這筆紀錄？')){S.tx=S.tx.filter(x=>x.id!==id);save();renderMoney()}}
function renderMoney(){let now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),arr=S.tx.filter(x=>x.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),e=arr.filter(x=>x.kind==='expense').reduce((a,b)=>a+b.amount,0),inc=arr.filter(x=>x.kind==='income').reduce((a,b)=>a+b.amount,0);$('balance').textContent='$'+(inc-e).toLocaleString();$('expense').textContent='$'+e.toLocaleString();$('income').textContent='$'+inc.toLocaleString();$('txCount').textContent=arr.length;$('moneyMonth').textContent=`${now.getFullYear()}年${now.getMonth()+1}月`;$('txList').innerHTML=arr.length?arr.map(x=>`<div class="item" onclick="delTx(${x.id})"><div><b>${x.cat}</b><div class="muted">${x.date.slice(5).replace('-','/')} ${x.note||''}</div></div><b style="color:${x.kind==='expense'?'var(--red)':'var(--green)'}">${x.kind==='expense'?'-':'+'}$${x.amount.toLocaleString()}</b></div>`).join(''):'<div class="muted" style="padding:16px 0">本月還沒有記帳紀錄。</div>'}
renderMoney();renderCal();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.update().catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(!sessionStorage.getItem('reloaded-v1-1')){
        sessionStorage.setItem('reloaded-v1-1','1');
        location.reload();
      }
    });
  }).catch(()=>{});
}
</script></body></html>
